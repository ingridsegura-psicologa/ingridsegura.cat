<!DOCTYPE html>
<html lang="{{lang}}">
<head>

<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16x16.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="language" content="{{lang}}">

<title>{{seoTitle}}</title>

<meta name="description" content="{{seoDescription}}">
<meta name="robots" content="index, follow">
<meta name="author" content="Ingrid Segura Bertomeu">

<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:type" content="article">
{{ogImageTag}}
<meta property="og:url" content="{{canonicalUrl}}">
<meta property="og:site_name" content="Ingrid Segura Psicòloga">

<link rel="canonical" href="{{canonicalUrl}}">

<link rel="alternate" hreflang="ca" href="{{urlCa}}">
<link rel="alternate" hreflang="es" href="{{urlEs}}">
<link rel="alternate" hreflang="x-default" href="{{urlCa}}">

<link rel="preload" href="../estils/estils.css" as="style">
<link rel="stylesheet" href="../estils/estils.css">

<script src="../js/main.js"></script>

<script type="application/ld+json">
{{jsonLd}}
</script>

</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="/" class="brand">Ingrid Segura</a>

    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="main-nav"
      aria-label="{{menuLabel}}">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" id="main-nav" aria-label="{{navLabel}}">

      {{navLinks}}

      <div class="lang-switch" aria-label="{{langLabel}}">
        <a href="{{fileCa}}">CAT</a>
        <a href="{{fileEs}}">ES</a>
      </div>

    </nav>

  </div>
</header>


<main class="inner-page">

  <section class="post-header">
    <div class="post-header-inner">

      <div class="post-back">
        <a href="{{blogHref}}">{{backText}}</a>
      </div>

      <h1 class="post-title">{{title}}</h1>

      <p class="post-meta">
        {{publishedText}}
      </p>

    </div>
  </section>


  <section class="post-content">
    <div class="post-content-inner">

      <article class="post-body">

{{contentHtml}}

{{referencesHtml}}

{{relatedHtml}}

{{ctaHtml}}

      </article>

    </div>
  </section>

</main>


<footer class="site-footer">

  <div class="footer-bottom">

    © Ingrid Segura 2026 · Psicòloga · Col·legi Oficial de Psicologia n.36181

    <br>

    <div class="footer-legal">
      <a href="{{legalHref}}">{{legalText}}</a>
      |
      <a href="{{faqHref}}">{{faqText}}</a>
    </div>

  </div>

</footer>


<div id="cookie-banner" class="cookie-banner">

  <p>{{cookieText}}</p>

  <div class="cookie-buttons">

    <button id="accept-cookies" class="button-line">
      {{acceptText}}
    </button>

    <button id="reject-cookies" class="button-line">
      {{rejectText}}
    </button>

  </div>

</div>

</body>
</html>
